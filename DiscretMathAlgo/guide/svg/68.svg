<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Префикс 7 разбивается на непересекающиеся блоки"><title>Префикс 7 разбивается на непересекающиеся блоки</title><defs><marker id="arrow10" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect x="109.0" y="70" width="142" height="40" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="180" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">bit[7] = a7 = 2</text><rect x="367.0" y="70" width="166" height="40" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="450" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">bit[6] = a5+a6 = 5</text><rect x="645.0" y="70" width="190" height="40" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="740" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">bit[4] = a1+…+a4 = 10</text><text x="80" y="175" font-family="Arial,sans-serif" font-size="16" fill="#475569">7 (0111) → 6 (0110) → 4 (0100) → 0</text><text x="80" y="220" font-family="Arial,sans-serif" font-size="16" fill="#475569">pref(7) = 2 + 5 + 10 = 17; каждый шаг стирает младший бит</text></svg>