<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="437" viewBox="0 0 1000 437" role="img" aria-label="Копия, перемещение и ссылка: три разных действия"><rect width="1000" height="437" rx="20" fill="#f1f5f9"/><text x="34" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Копия, перемещение и ссылка: три разных действия</text><rect x="28" y="76" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="76" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="103" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">Глубокая копия: B создаёт собственный ресурс</text><text x="48" y="127" font-family="Arial,sans-serif" font-size="17" fill="#334155">A → блок 1; B → блок 2. Изменение B не меняет данные A.</text><rect x="28" y="159" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="159" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="186" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">Перемещение владельца: ресурс передаётся B</text><text x="48" y="210" font-family="Arial,sans-serif" font-size="17" fill="#334155">До: A → блок 1. После: B → блок 1; состояние A задаёт реализация класса.</text><rect x="28" y="242" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="242" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="269" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">Ссылка: нового объекта и нового владельца нет</text><text x="48" y="293" font-family="Arial,sans-serif" font-size="17" fill="#334155">T&amp; alias = A; alias и A обозначают один объект.</text><rect x="28" y="325" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="325" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="352" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">std::move(A): только изменение категории выражения</text><text x="48" y="376" font-family="Arial,sans-serif" font-size="17" fill="#334155">Выбор copy/move зависит от перегрузок, доступности методов и const.</text></svg>