<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Время жизни Derived: создание и разрушение"><rect width="1000" height="520" rx="20" fill="#f1f5f9"/><text x="34" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Время жизни Derived: создание и разрушение</text><rect x="28" y="76" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="76" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="103" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">1. Виртуальные базы</text><text x="48" y="127" font-family="Arial,sans-serif" font-size="17" fill="#334155">Инициализирует наиболее производный класс; далее — прямые базы.</text><rect x="28" y="159" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="159" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="186" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">2. Прямые базы</text><text x="48" y="210" font-family="Arial,sans-serif" font-size="17" fill="#334155">В порядке объявления в списке наследования, каждая со своими полями.</text><rect x="28" y="242" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="242" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="269" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">3. Поля Derived</text><text x="48" y="293" font-family="Arial,sans-serif" font-size="17" fill="#334155">В порядке объявления в классе, независимо от списка инициализации.</text><rect x="28" y="325" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="325" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="352" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">4. Тело конструктора Derived</text><text x="48" y="376" font-family="Arial,sans-serif" font-size="17" fill="#334155">Все базы и поля уже инициализированы.</text><rect x="28" y="408" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="408" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="435" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">5. Разрушение</text><text x="48" y="459" font-family="Arial,sans-serif" font-size="17" fill="#334155">Тело ~Derived → поля в обратном порядке → базы в обратном порядке.</text></svg>