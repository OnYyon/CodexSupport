<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="437" viewBox="0 0 1000 437" role="img" aria-label="Как разобрать вызов метода через Base&amp;"><rect width="1000" height="437" rx="20" fill="#f1f5f9"/><text x="34" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Как разобрать вызов метода через Base&amp;</text><rect x="28" y="76" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="76" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="103" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">1. Статический тип выражения</text><text x="48" y="127" font-family="Arial,sans-serif" font-size="17" fill="#334155">Определяет поиск имени, доступ, перегрузку и аргументы по умолчанию.</text><rect x="28" y="159" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="159" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="186" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">2. Метод невиртуальный</text><text x="48" y="210" font-family="Arial,sans-serif" font-size="17" fill="#334155">Вызывается реализация, выбранная по статическому типу.</text><rect x="28" y="242" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="242" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="269" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">3. Метод виртуальный</text><text x="48" y="293" font-family="Arial,sans-serif" font-size="17" fill="#334155">Вызывается конечное переопределение для динамического типа объекта.</text><rect x="28" y="325" width="944" height="66" rx="10" fill="white" stroke="#cbd5e1"/><rect x="28" y="325" width="7" height="66" rx="3" fill="#0284c7"/><text x="48" y="352" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#075985">4. Исключения для разбора</text><text x="48" y="376" font-family="Arial,sans-serif" font-size="17" fill="#334155">Base::f() подавляет виртуальность; в ctor/dtor действует текущий класс.</text></svg>